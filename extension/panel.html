<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Voice</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1>Jev Voice</h1>
  <span id="host" class="pill">connecting…</span>
</header>

<section class="talk">
  <button id="mic" class="big">🎙 Speak</button>
  <textarea id="text" rows="4" placeholder="Your command appears here while you speak. You can also type it (Ctrl+Enter runs it)."></textarea>
  <div class="row">
    <button id="run" class="primary">Run</button>
    <button id="stop" class="danger" disabled>■ Stop</button>
  </div>
</section>

<section id="confirm" class="confirm" hidden>
  <p>Approve this action: <strong id="confirm-text"></strong></p>
  <div class="row">
    <button id="confirm-yes" class="primary">Approve</button>
    <button id="confirm-no">Decline</button>
  </div>
</section>

<section id="result" class="result" hidden>
  <p id="result-text"></p>
  <button id="show-tab" hidden>Show the tab</button>
</section>

<section class="journal">
  <h2>Activity</h2>
  <ol id="log"></ol>
</section>

<details class="settings">
  <summary>Settings</summary>
  <label>Planner model (claude -p, low effort)
    <select id="model">
      <option value="sonnet">Claude Sonnet</option>
      <option value="haiku">Claude Haiku</option>
    </select>
  </label>
  <label>Speech language
    <select id="language">
      <option value="en">English</option>
      <option value="multi">Multilingual (auto)</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="es">Spanish</option>
      <option value="it">Italian</option>
      <option value="pt">Portuguese</option>
      <option value="nl">Dutch</option>
      <option value="ja">Japanese</option>
    </select>
  </label>
  <label>Pause between two actions (seconds)
    <input id="delay" type="number" min="0" max="30" step="0.5" value="0">
  </label>
  <label class="check"><input id="confirm-on" type="checkbox" checked> Ask before sending, posting, buying or deleting</label>
  <label class="check"><input id="autorun" type="checkbox" checked> Run as soon as dictation ends</label>
  <label class="check"><input id="whisper" type="checkbox"> Final text by Whisper (more accurate, about 2 s slower)</label>
</details>

<script src="guard.js"></script>
<script src="panel.js"></script>
</body>
</html>
